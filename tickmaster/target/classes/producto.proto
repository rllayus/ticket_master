syntax = "proto3";

// Definimos el paquete Java donde se generará el código
option java_package = "edu.upb.tickmaster.grpc";
option java_multiple_files = true;

package tickmaster;

// Definición del Servicio
service ProductoService {
  // RPC Unario: El cliente envía un producto y recibe una confirmación
  rpc registrarProducto (ProductoRequest) returns (ProductoResponse);

  // RPC Unario: Buscar por ID
  rpc obtenerProducto (IdRequest) returns (ProductoRequest);
}

// Enumeración para categorías (buena práctica pedagógica)
enum Categoria {
  ELECTRONICA = 0;
  ALIMENTOS = 1;
  VESTIMENTA = 2;
  OTROS = 3;
}

// El mensaje que representa al Producto
message ProductoRequest {
  string id = 1; // Los números son las "etiquetas" para el binario
  string nombre = 2;
  string descripcion = 3;
  double precio = 4;
  int32 stock = 5;
  Categoria categoria = 6;
}

// Respuesta del servidor
message ProductoResponse {
  string codigo_respuesta = 1;
  string mensaje = 2;
  string timestamp = 3;
}

// Mensaje para consultas por ID
message IdRequest {
  string id = 1;
}
